<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3b2f"/>
      <stop offset="100%" stop-color="#2c1d11"/>
    </linearGradient>
    <linearGradient id="logo-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c89b"/>
      <stop offset="50%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#b58552"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 8)">
    <rect width="64" height="64" rx="18" fill="url(#logo-bg)"/>
    <rect width="64" height="64" rx="18" fill="none" stroke="#d4a574" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Crescent Moon -->
    <path d="M 14 12 A 7 7 0 0 0 21 19 A 7 7 0 1 1 14 12 Z" fill="url(#logo-gold)" opacity="0.85"/>

    <!-- Open Book -->
    <g transform="translate(32, 40)">
      <path d="M -22 10 C -13 4, -4 6, 0 10 C 4 6, 13 4, 22 10 L 22 -12 C 13 -18, 4 -16, 0 -11 C -4 -16, -13 -18, -22 -12 Z" fill="url(#logo-gold)"/>
      <path d="M -19 8 C -11 3, -3 5, 0 8 C 3 5, 11 3, 19 8 L 19 -9 C 11 -14, 3 -12, 0 -8 C -3 -12, -11 -14, -19 -9 Z" fill="#f8f5f0"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#7a5c42" stroke-width="1.5"/>
      <path d="M 0 -22 L 1.8 -16 L 7 -14.5 L 1.8 -13 L 0 -7 L -1.8 -13 L -7 -14.5 L -1.8 -16 Z" fill="#ffffff"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="90" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" font-weight="bold" fill="#4a3b2f" letter-spacing="-0.5">
    A?Bookshelf
  </text>
  <text x="92" y="60" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7a5c42" opacity="0.75" letter-spacing="1.5">
    DIGITAL LIBRARY SHOWCASE
  </text>
</svg>

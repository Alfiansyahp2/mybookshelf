<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2c99a"/>
      <stop offset="45%" style="stop-color:#cdb07c"/>
      <stop offset="100%" style="stop-color:#b89860"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#863bff"/>
      <stop offset="100%" style="stop-color:#7e14ff"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle texture overlay -->
  <rect width="1200" height="630" fill="rgba(0,0,0,0.03)"/>
  
  <!-- Decorative bookshelf lines -->
  <rect x="80" y="480" width="1040" height="4" rx="2" fill="rgba(101,67,33,0.15)"/>
  <rect x="120" y="380" width="960" height="3" rx="1.5" fill="rgba(101,67,33,0.1)"/>
  
  <!-- Book silhouettes on shelf -->
  <rect x="150" y="400" width="30" height="76" rx="3" fill="rgba(134,59,255,0.15)" transform="rotate(-2 165 438)"/>
  <rect x="185" y="405" width="25" height="71" rx="3" fill="rgba(101,67,33,0.12)" transform="rotate(1 197 440)"/>
  <rect x="215" y="398" width="28" height="78" rx="3" fill="rgba(134,59,255,0.1)"/>
  <rect x="250" y="402" width="22" height="74" rx="3" fill="rgba(101,67,33,0.1)" transform="rotate(-1 261 439)"/>
  <rect x="280" y="410" width="32" height="66" rx="3" fill="rgba(134,59,255,0.12)" transform="rotate(2 296 443)"/>
  
  <rect x="900" y="395" width="28" height="81" rx="3" fill="rgba(134,59,255,0.12)" transform="rotate(1 914 435)"/>
  <rect x="935" y="403" width="25" height="73" rx="3" fill="rgba(101,67,33,0.1)" transform="rotate(-2 947 439)"/>
  <rect x="968" y="400" width="30" height="76" rx="3" fill="rgba(134,59,255,0.15)"/>
  <rect x="1005" y="408" width="22" height="68" rx="3" fill="rgba(101,67,33,0.12)" transform="rotate(1 1016 442)"/>
  
  <!-- Lightning bolt logo -->
  <g transform="translate(540, 120) scale(2.5)">
    <path fill="#863bff" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"/>
  </g>
  
  <!-- App name -->
  <text x="600" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="bold" fill="#3D2B1F" text-anchor="middle">MyBookshelf</text>
  
  <!-- Tagline -->
  <text x="600" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="rgba(61,43,31,0.7)" text-anchor="middle">Your Personal Digital Library</text>
  
  <!-- Decorative line -->
  <rect x="450" y="410" width="300" height="2" rx="1" fill="rgba(134,59,255,0.3)"/>
  
  <!-- URL hint -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="18" fill="rgba(61,43,31,0.4)" text-anchor="middle">mybookshelf.app</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="40%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#f3e8d7"/>
      <stop offset="60%" stop-color="#f8f5f0"/>
      <stop offset="100%" stop-color="#eee4d2"/>
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="50%" stop-color="#c29b68"/>
      <stop offset="100%" stop-color="#7a5c42"/>
    </linearGradient>

    <!-- Spine Gradients -->
    <linearGradient id="spine-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3b2f"/><stop offset="50%" stop-color="#6b5342"/><stop offset="100%" stop-color="#2c1d11"/>
    </linearGradient>
    <linearGradient id="spine-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006666"/><stop offset="50%" stop-color="#008080"/><stop offset="100%" stop-color="#004d4d"/>
    </linearGradient>
    <linearGradient id="spine-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b4965"/><stop offset="50%" stop-color="#2b5c7e"/><stop offset="100%" stop-color="#0f2b3c"/>
    </linearGradient>
    <linearGradient id="spine-4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b22222"/><stop offset="50%" stop-color="#d32f2f"/><stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
    <linearGradient id="spine-5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a574"/><stop offset="50%" stop-color="#e2bc8a"/><stop offset="100%" stop-color="#a67c52"/>
    </linearGradient>
    <linearGradient id="spine-6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d2d44"/><stop offset="50%" stop-color="#3e5c76"/><stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4a3b2f" flood-opacity="0.18"/>
    </filter>
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d4a574" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#7a5c42" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- ── CELESTIAL AMBIENT DECORATIONS ── -->
  <!-- 4-Point Sparkle Star Top Left -->
  <path d="M 120 100 L 123 118 L 141 121 L 123 124 L 120 142 L 117 124 L 99 121 L 117 118 Z" fill="#d4a574" opacity="0.75" filter="url(#glow-light)"/>

  <!-- Crescent Moon Top Right -->
  <path d="M 1060 90 A 22 22 0 0 0 1082 112 A 22 22 0 1 1 1060 90 Z" fill="#7a5c42" opacity="0.65"/>

  <!-- 8-Point Star Right -->
  <path d="M 1040 280 L 1043 294 L 1057 297 L 1043 300 L 1040 314 L 1037 300 L 1023 297 L 1037 294 Z" fill="#c29b68" opacity="0.7"/>

  <!-- Ringed Saturn Planet Left -->
  <g transform="translate(100, 320)" opacity="0.65">
    <ellipse cx="20" cy="20" rx="22" ry="7" fill="none" stroke="#7a5c42" stroke-width="1.8" transform="rotate(-20 20 20)"/>
    <circle cx="20" cy="20" r="10" fill="#d4a574"/>
  </g>

  <!-- Shooting Star Diagonal Streak Top Center -->
  <g transform="translate(680, 70) rotate(38)" opacity="0.8">
    <line x1="0" y1="0" x2="160" y2="0" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="162" cy="0" r="4" fill="#ffffff" filter="url(#glow-light)"/>
  </g>

  <!-- ── BRAND LOGO & HEADER ── -->
  <!-- Open Book Icon Logo -->
  <g transform="translate(580, 75)" filter="url(#shadow)">
    <!-- Book Wings -->
    <path d="M -30 18 C -18 10, -5 12, 0 18 C 5 12, 18 10, 30 18 L 30 -12 C 18 -18, 5 -16, 0 -10 C -5 -16, -18 -18, -30 -12 Z" fill="#4a3b2f"/>
    <!-- Book Pages -->
    <path d="M -27 15 C -16 8, -4 10, 0 15 C 4 10, 16 8, 27 15 L 27 -9 C 16 -15, 4 -13, 0 -8 C -4 -13, -16 -15, -27 -9 Z" fill="#f8f5f0"/>
    <!-- Center Crease -->
    <line x1="0" y1="-8" x2="0" y2="15" stroke="#7a5c42" stroke-width="1.5"/>
    <!-- Floating Celestial Star above Logo -->
    <path d="M 0 -22 L 2 -15 L 9 -13 L 2 -11 L 0 -4 L -2 -11 L -9 -13 L -2 -15 Z" fill="#d4a574"/>
  </g>

  <!-- Brand Name -->
  <text x="600" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-style="italic" font-weight="bold" fill="#4a3b2f" text-anchor="middle" letter-spacing="-1">
    A?Bookshelf
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" fill="#7a5c42" text-anchor="middle" opacity="0.95">
    Abadikan Setiap Lembar Cerita &amp; Perjalanan Membacamu.
  </text>

  <!-- Decorative Separator Line -->
  <line x1="500" y1="225" x2="700" y2="225" stroke="#d4a574" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- ── CENTRAL 3D STANDING BOOK SPINES SHOWCASE ── -->
  <g transform="translate(270, 260)" filter="url(#shadow)">
    <!-- Book 1: Berdamai Dengan Diri -->
    <g transform="translate(0, 20) rotate(-3)">
      <rect x="0" y="0" width="38" height="230" rx="4" fill="url(#spine-1)"/>
      <rect x="3" y="0" width="2" height="230" fill="rgba(255,255,255,0.15)"/>
      <text x="19" y="120" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#f8f5f0" text-anchor="middle" transform="rotate(-90 19 120)">BERDAMAI DENGAN DIRI</text>
      <circle cx="19" cy="20" r="3" fill="#d4a574"/>
    </g>

    <!-- Book 2: Man's Search For Meaning -->
    <g transform="translate(48, 0) rotate(1)">
      <rect x="0" y="0" width="42" height="250" rx="4" fill="url(#spine-2)"/>
      <rect x="3" y="0" width="2" height="250" fill="rgba(255,255,255,0.15)"/>
      <text x="21" y="130" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#f8f5f0" text-anchor="middle" transform="rotate(-90 21 130)">MAN'S SEARCH FOR MEANING</text>
      <circle cx="21" cy="20" r="3.5" fill="#d4a574"/>
    </g>

    <!-- Book 3: 1984 -->
    <g transform="translate(100, 10) rotate(-1)">
      <rect x="0" y="0" width="40" height="240" rx="4" fill="url(#spine-3)"/>
      <rect x="3" y="0" width="2" height="240" fill="rgba(255,255,255,0.15)"/>
      <text x="20" y="125" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#f8f5f0" text-anchor="middle" transform="rotate(-90 20 125)">1984 - GEORGE ORWELL</text>
      <circle cx="20" cy="20" r="3" fill="#d4a574"/>
    </g>

    <!-- Book 4: Janji (Tere Liye) -->
    <g transform="translate(150, 5) rotate(2)">
      <rect x="0" y="0" width="44" height="245" rx="4" fill="url(#spine-4)"/>
      <rect x="3" y="0" width="2" height="245" fill="rgba(255,255,255,0.15)"/>
      <text x="22" y="130" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#f8f5f0" text-anchor="middle" transform="rotate(-90 22 130)">JANJI - TERE LIYE</text>
      <circle cx="22" cy="20" r="3.5" fill="#f8f5f0"/>
    </g>

    <!-- Book 5: Tuesdays With Morrie -->
    <g transform="translate(204, 15) rotate(-2)">
      <rect x="0" y="0" width="40" height="235" rx="4" fill="url(#spine-5)"/>
      <rect x="3" y="0" width="2" height="235" fill="rgba(0,0,0,0.15)"/>
      <text x="20" y="122" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#4a3b2f" text-anchor="middle" transform="rotate(-90 20 122)">TUESDAYS WITH MORRIE</text>
      <circle cx="20" cy="20" r="3" fill="#4a3b2f"/>
    </g>

    <!-- Book 6: Courage To Be Disliked -->
    <g transform="translate(254, 8) rotate(1)">
      <rect x="0" y="0" width="42" height="242" rx="4" fill="url(#spine-6)"/>
      <rect x="3" y="0" width="2" height="242" fill="rgba(255,255,255,0.15)"/>
      <text x="21" y="126" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#f8f5f0" text-anchor="middle" transform="rotate(-90 21 126)">THE LITTLE PRINCE</text>
      <circle cx="21" cy="20" r="3.5" fill="#d4a574"/>
    </g>

    <!-- Bookshelf Base Plank -->
    <rect x="-30" y="248" width="680" height="10" rx="3" fill="#7a5c42" opacity="0.85"/>
    <rect x="-30" y="258" width="680" height="4" rx="1" fill="#4a3b2f" opacity="0.4"/>
  </g>

  <!-- ── FOOTER INFORMATION ── -->
  <!-- Feature Badge Left -->
  <g transform="translate(80, 560)">
    <rect x="0" y="0" width="260" height="34" rx="17" fill="#4a3b2f" opacity="0.08"/>
    <text x="130" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7a5c42" text-anchor="middle" letter-spacing="0.5">
      PERSONAL DIGITAL LIBRARY
    </text>
  </g>

  <!-- URL Hint Right -->
  <g transform="translate(860, 560)">
    <rect x="0" y="0" width="260" height="34" rx="17" fill="#4a3b2f"/>
    <text x="130" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8f5f0" text-anchor="middle" letter-spacing="0.5">
      buka A?Bookshelf ↗
    </text>
  </g>
</svg>

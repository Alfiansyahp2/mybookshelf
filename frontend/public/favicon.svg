<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3b2f"/>
      <stop offset="100%" stop-color="#2c1d11"/>
    </linearGradient>
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c89b"/>
      <stop offset="50%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#b58552"/>
    </linearGradient>
    <filter id="fav-glow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#d4a574" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#fav-bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#d4a574" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Celestial Crescent Moon Top Left -->
  <path d="M 14 12 A 7 7 0 0 0 21 19 A 7 7 0 1 1 14 12 Z" fill="url(#fav-gold)" opacity="0.85"/>

  <!-- Sparkle Star Top Right -->
  <path d="M 48 10 L 49.5 15.5 L 55 17 L 49.5 18.5 L 48 24 L 46.5 18.5 L 41 17 L 46.5 15.5 Z" fill="#ffffff" filter="url(#fav-glow)"/>

  <!-- Open Hardcover Book Center Icon -->
  <g transform="translate(32, 40)">
    <!-- Outer Book Wings (Cover) -->
    <path d="M -22 10 C -13 4, -4 6, 0 10 C 4 6, 13 4, 22 10 L 22 -12 C 13 -18, 4 -16, 0 -11 C -4 -16, -13 -18, -22 -12 Z" fill="url(#fav-gold)"/>
    <!-- Inner Book Pages (Paperback) -->
    <path d="M -19 8 C -11 3, -3 5, 0 8 C 3 5, 11 3, 19 8 L 19 -9 C 11 -14, 3 -12, 0 -8 C -3 -12, -11 -14, -19 -9 Z" fill="#f8f5f0"/>
    <!-- Spine Line -->
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#7a5c42" stroke-width="1.5"/>
    <!-- Floating Sparkle Core Star -->
    <path d="M 0 -22 L 1.8 -16 L 7 -14.5 L 1.8 -13 L 0 -7 L -1.8 -13 L -7 -14.5 L -1.8 -16 Z" fill="#ffffff" filter="url(#fav-glow)"/>
  </g>
</svg>